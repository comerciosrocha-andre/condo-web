    const numeroParaExtenso = (v) => {
      const valorNum = parseFloat(v.replace('R$', '').replace('.', '').replace(',', '.').trim());
      if (isNaN(valorNum) || valorNum <= 0) return 'Zero reais';

      const unidades = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezenove'];
      const dezenas = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
      const centenas = ['', 'cem', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];

      const partes = valorNum.toFixed(2).split('.');
      const reais = parseInt(partes[0], 10);
      const centavos = parseInt(partes[1], 10);

      let extensoReais = '';
      if (reais > 0) {
        if (reais === 1000) {
          extensoReais = 'um mil reais';
        } else if (reais > 1000) {
          const milhar = Math.floor(reais / 1000);
          const resto = reais % 1000;
          const milharStr = milhar === 1 ? 'mil' : `${unidades[milhar]} mil`;
          extensoReais = resto === 0 ? `${milharStr} reais` : `${milharStr} e ${converterAte999(resto)} reais`;
        } else {
          extensoReais = `${converterAte999(reais)} ${reais === 1 ? 'real' : 'reais'}`;
        }
      }

      let extensoCentavos = '';
      if (centavos > 0) {
        extensoCentavos = `${converterAte999(centavos)} ${centavos === 1 ? 'centavo' : 'centavos'}`;
      }

      if (reais > 0 && centavos > 0) return `${extensoReais} e ${extensoCentavos}`;
      if (reais > 0) return extensoReais;
      return extensoCentavos;

      function converterAte999(n) {
        if (n === 100) return 'cem';
        if (n < 20) return unidades[n];
        if (n < 100) {
          const d = Math.floor(n / 10);
          const u = n % 10;
          return u === 0 ? dezenas[d] : `${dezenas[d]} e ${unidades[u]}`;
        }
        const c = Math.floor(n / 100);
        const resto = n % 100;
        if (resto === 0) return centenas[c];
        return `${centenas[c]} e ${converterAte999(resto)}`;
      }
    };

        doc.text("Especialista Imobiliário", 105, 185, { align: "center" });
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.setTextColor(148, 163, 184);
        doc.text(`Síndico Responsável ${nomeCondominioExibido ? '- ' + nomeCondominioExibido : ''}`, 105, 191, { align: "center" });

        doc.save(`Recibo_${cob.titulo.replace(/\s+/g, '_')}.pdf`);
      };

      const exportarPlanilha = () => {
        let csv = "data:text/csv;charset=utf-8,";
        csv += `Relatorio Financeiro - ${perfilLogado.toUpperCase()},${nomeCondominioExibido || 'Condomínio'}\n\n`;
        csv += "Titulo,Unidade,Valor,Vencimento,Data Pagamento,Data Confirmacao Sindico,Status\n";
        cobrancasGerais.forEach(c => {
          const st = c.confirmadoSindico ? 'Quitado' : c.pagoMorador ? 'Aguardando' : 'Pendente';
          csv += `${c.titulo},${c.unidade},${c.valor},${c.vencimento},${c.dataPagamentoMorador || 'N/A'},${c.dataConfirmacaoSindico || 'N/A'},${st}\n`;
        });
        const encodedUri = encodeURI(csv);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Balancete_${perfilLogado}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const getMenuItems = () => {
        const baseMenu = [
          { id: 'visao', label: 'Visão geral' },
          { id: 'financeiro', label: 'Financeiro' },
        ];

        if (perfilLogado === 'sindico') {
          baseMenu.push(
            { id: 'cadastrar_espacos', label: 'Cadastrar Espaços' },
            { id: 'unidades', label: 'Unidades & moradores' },
            { id: 'recibos', label: 'Emitir Recibos' }
          );
        }

        baseMenu.push(
          { id: 'reservas', label: 'Reservas & espaços' },
          { id: 'mudancas', label: 'Agendamento de Mudanças' },
          { id: 'achados', label: 'Achados e Perdidos' },
          { id: 'mural', label: 'Mural de avisos' },
          { id: 'assembleia', label: 'Assembleia' },
          { id: 'encomendas', label: 'Encomendas' },
          { id: 'veiculos', label: 'Veículos & vagas' },
          { id: 'mercado', label: 'Mercado de vizinhos' }
        );

        if (perfilLogado === 'sindico' || (perfilLogado === 'condomino' && autorizaContatoSindico)) {
          baseMenu.push({ id: 'fale_sindico', label: 'Fale com o síndico' });
        }

        if (perfilLogado === 'condomino') {
          baseMenu.push({ id: 'vender_apto', label: 'Vender / Alugar Apto (Corretor)' });
        }

        baseMenu.push({ id: 'ajuda', label: 'Ajuda & manuais' });

        return baseMenu;

                <option key={e.uf} value={e.uf}>{e.nome}</option>

                            <datalist id={`lista-cidades-mor-${formCadastroMorador.estadoCondominio}`}>

                                <option key={c} value={c} />

                            <label className="block text-[11px] font-bold text-slate-600 mb-1">Bairro:</label>

                                <option key={b} value={b} />

                                if (v.length >= 3) v = `${v.substring(0,2)}/${v.substring(2,4)}`;

                                  v = `(${v}`;

                          <input

                            value={formCadastroSindico.cidadeCondominio}
                            onChange={(e) => setFormCadastroSindico({...formCadastroSindico, cidadeCondominio: e.target.value})}
                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-medium text-slate-800 placeholder-slate-400"

                            placeholder="Ex: Santos"

                              if (v.length > 2) {
                                v = `(${v.substring(0,2)}) ${v.substring(2)}`;

                      <button 
                        onClick={() => { setPerfilLogado('sindico'); setAbaAtiva('visao'); }}

              )}
            </div>
          </div>
        );
      }

      const cobrancasExibidas = perfilLogado === 'sindico' ? cobrancasGerais : cobrancasGerais.filter(c => c.unidade === '402' || c.unidade === dadosMoradorLogado.apto);

      const encomendasExibidas = perfilLogado === 'sindico' ? encomendas : encomendas.filter(e => e.apto === '402' || e.apto === dadosMoradorLogado.apto);
      const veiculosVagasExibidos = perfilLogado === 'sindico' ? listaVeiculosVagas : listaVeiculosVagas.filter(v => v.apto === '402' || v.apto === dadosMoradorLogado.apto);
      const vagasDisponiveisLocacao = listaVeiculosVagas.filter(v => v.disponivelLocacaoMorador === true);
      const meusProdutosMercado = mercadoAnuncios.filter(a => a.anunciante.includes(dadosMoradorLogado.apto) || a.anunciante.includes('402') || (perfilLogado === 'sindico' && a.anunciante.includes('Síndico')));

                    <h1 className="text-white font-bold text-xs truncate">

                        <span className="text-slate-400 font-normal">·</span>
                        <span className="text-emerald-400">{dadosMoradorLogado.apto}</span>
                      </div>
                    ) : (
                      <p className="text-[11px] text-amber-400 font-semibold capitalize truncate">

            <div className="p-4 border-t border-slate-800/80 space-y-2">
              <button

          {/* CONTEÚDO PRINCIPAL DINÂMICO */}

            {/* CABEÇALHO PARA CELULAR COM BOTÃO DO MENU HAMBÚRGUER (BOTÃO AMARELO À ESQUERDA) */}
            <div className="md:hidden bg-[#0B192C] text-white p-4 flex items-center justify-between border-b border-slate-800">
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setMenuMobileAberto(true)}
                  className="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-2.5 rounded-xl text-lg shadow-md cursor-pointer flex items-center justify-center"
                >
                  ☰
                </button>
                <div>
                  <h3 className="font-bold text-xs truncate max-w-[180px]">{nomeCondominioExibido || 'Condô Web'}</h3>
                  <p className="text-[10px] text-amber-400 capitalize">{perfilLogado === 'sindico' ? 'Painel Síndico' : `Morador · ${dadosMoradorLogado.apto}`}</p>
                </div>
              </div>
              <span className="text-xs bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-lg font-bold border border-amber-500/30">
                App
              </span>
            </div>

            {/* ABA: VISÃO GERAL */}
            {abaAtiva === 'visao' && (

                <div>
                  <h2 className="text-2xl font-black text-slate-900 tracking-tight">Visão geral</h2>

                {/* CARD DE CHAVE MESTRA NA VISÃO GERAL DO MORADOR */}

                    <div className="flex items-center gap-3.5">
                      <div className="w-12 h-12 rounded-2xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-2xl shrink-0">

                      </div>

                    <span className="text-xs text-emerald-600 font-semibold mt-1 block">Aguardando retirada</span>

                    <span className="block text-3xl font-black text-slate-900 mt-2">
                      {reservasExibidas.length}
                    </span>

                  </div>
                  <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                    <span className="text-[11px] font-extrabold text-slate-400 uppercase">ASSEMBLEIAS ATIVAS</span>
                    <span className="block text-3xl font-black text-slate-900 mt-2">{pautasVotacao.length}</span>
                    <span className="text-xs text-blue-600 font-semibold mt-1 block">Votações em andamento</span>
                  </div>
                  <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                    <span className="text-[11px] font-extrabold text-slate-400 uppercase">SITUAÇÃO FINANCEIRA</span>
                    <span className="block text-3xl font-black text-emerald-600 mt-2">Em dia</span>
                    <span className="text-xs text-slate-500 font-semibold mt-1 block">Sem pendências</span>
                  </div>
                </div>

                {/* BLOCO EXTRA DE MÉTRICAS EXCLUSIVAS PARA O SÍNDICO */}
                {perfilLogado === 'sindico' && (
                  <div className="bg-white p-6 rounded-3xl border border-amber-200/80 shadow-sm space-y-4 bg-amber-50/20">
                    <div className="flex items-center justify-between">
                      <h3 className="text-sm font-black text-slate-900 uppercase tracking-wide">📊 Indicadores Adicionais de Gestão do Síndico</h3>
                      <span className="text-xs text-amber-700 font-bold bg-amber-100/80 px-3 py-1 rounded-full">Painel Administrativo</span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 pt-1">
                      <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs">
                        <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wide">Qtde de moradores</span>
                        <span className="block text-2xl font-black text-slate-900 mt-1">{listaMoradores.length}</span>
                        <span className="text-[11px] text-slate-500 font-medium mt-0.5 block">Moradores cadastrados</span>

                        <span className="block text-sm font-black text-slate-900 mt-1 truncate">
                          {listaRecibosEmitidos.length > 0 ? listaRecibosEmitidos[0].titulo : 'Nenhum emitido'}

                        </span>
                      </div>

                      <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs">
                        <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wide">Próxima mudança</span>
                        <span className="block text-sm font-black text-slate-900 mt-1">

                        <span className="text-[11px] text-blue-700 font-bold mt-0.5 block">
                          {listaMudancas.length > 0 ? `Data: ${listaMudancas[0].data}` : '---'}

                      </div>

                      <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs">
                        <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wide">Último achado e perdido</span>
                        <span className="block text-sm font-black text-slate-900 mt-1 truncate">
                          {achadosPerdidos.length > 0 ? achadosPerdidos[0].titulo : 'Nenhum item'}
                        </span>
                        <span className="text-[11px] text-amber-700 font-bold mt-0.5 block">
                          {achadosPerdidos.length > 0 ? `${achadosPerdidos[0].status} (${achadosPerdidos[0].data})` : '---'}
                        </span>
                      </div>
                    </div>
                  </div>
                )}

                {perfilLogado === 'condomino' && (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 pt-1">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-2">
                      <span className="text-[11px] font-extrabold text-slate-400 uppercase tracking-wide">Minhas reservas</span>
                      <div className="space-y-1.5 pt-1">
                        {reservasExibidas.length === 0 ? (
                          <p className="text-xs text-slate-500">Nenhuma reserva ativa.</p>
                        ) : (
                          reservasExibidas.map(r => (
                            <div key={r.id} className="text-xs bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                              <p className="font-bold text-slate-900">{r.espaco}</p>
                              <p className="text-[11px] text-slate-500">{r.data} · {r.horario}</p>
                            </div>

                        )}
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-2">
                      <span className="text-[11px] font-extrabold text-slate-400 uppercase tracking-wide">Minhas encomendas</span>
                      <div className="space-y-1.5 pt-1">
                        {encomendasExibidas.length === 0 ? (
                          <p className="text-xs text-slate-500">Nenhuma encomenda na portaria.</p>
                        ) : (
                          encomendasExibidas.map(e => (
                            <div key={e.id} className="text-xs bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                              <p className="font-bold text-slate-900">{e.desc}</p>
                              <p className="text-[10px] text-amber-700 font-mono font-bold mt-0.5">Cod: {e.codigoLocalizacao}</p>
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-2">
                      <span className="text-[11px] font-extrabold text-slate-400 uppercase tracking-wide">Meus veículos cadastrados</span>
                      <div className="space-y-1.5 pt-1">
                        {veiculosVagasExibidos.length === 0 ? (
                          <p className="text-xs text-slate-500">Nenhum veículo cadastrado.</p>
                        ) : (
                          veiculosVagasExibidos.map(v => (
                            <div key={v.id} className="text-xs bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                              <p className="font-bold text-slate-900">{v.modelo}</p>
                              <p className="text-[11px] text-slate-500">Placa: {v.placa} · Vaga: {v.vaga}</p>
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-2">
                      <span className="text-[11px] font-extrabold text-slate-400 uppercase tracking-wide">Meus produtos no mercado</span>
                      <div className="space-y-1.5 pt-1">
                        {meusProdutosMercado.length === 0 ? (
                          <p className="text-xs text-slate-500">Nenhum anúncio publicado.</p>
                        ) : (
                          meusProdutosMercado.map(m => (
                            <div key={m.id} className="text-xs bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                              <p className="font-bold text-slate-900 truncate">{m.titulo}</p>
                              <p className="text-[11px] text-emerald-700 font-bold">{m.preco}</p>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                  <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
                    <h3 className="text-lg font-black text-slate-900">Últimos avisos</h3>
                    <div className="space-y-3">
                      {avisosRecentes.length === 0 ? (
                        <p className="text-xs text-slate-500">Nenum aviso publicado no mural.</p>
                      ) : (
                        avisosRecentes.slice(0, 3).map(aviso => (
                          <div key={aviso.id} className="p-4 rounded-2xl border border-slate-100 bg-slate-50/60">
                            <h4 className="text-sm font-bold text-slate-900">{aviso.titulo}</h4>
                            <p className="text-xs text-slate-500 mt-1">{aviso.data}</p>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
                    <h3 className="text-lg font-black text-slate-900">Pautas em votação</h3>
                    <div className="space-y-3">

                        pautasVotacao.map(pauta => {
                          const totalVotos = (pauta.votosFavor || 0) + (pauta.votosContra || 0);
                          const percentualFavor = totalVotos > 0 ? Math.round(((pauta.votosFavor || 0) / totalVotos) * 100) : 0;

                          return (
                            <div key={pauta.id} className="p-4 rounded-2xl border border-slate-100 bg-slate-50/60 space-y-2">
                              <h4 className="text-sm font-bold text-slate-900">{pauta.titulo}</h4>
                              <div className="flex items-center justify-between text-xs">
                                <span className="text-amber-700 font-medium">{pauta.info}</span>
                                <span className="bg-emerald-100 text-emerald-800 font-black px-2.5 py-0.5 rounded-full text-[11px]">
                                  Favorabilidade: {percentualFavor}%
                                </span>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ABA: VENDER / ALUGAR APTO (CORRETOR) */}
            {abaAtiva === 'vender_apto' && (
              <div className="p-4 md:p-8 space-y-6">
                <div>
                  <h2 className="text-2xl font-black text-slate-900 tracking-tight">Vender / Alugar Imóvel</h2>
                  <p className="text-sm text-slate-500 mt-0.5">Parceria com o Especialista Imobiliário para venda ou locação do seu apartamento com atendimento exclusivo.</p>
                </div>

                <div className="bg-white p-8 rounded-3xl border border-slate-200/80 shadow-sm max-w-xl text-center space-y-6">
                  <div className="w-16 h-16 bg-amber-500/20 border border-amber-500/30 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold text-amber-600">
                    🏠
                  </div>
                  <div className="space-y-2">
                    <h3 className="text-lg font-black text-slate-900">Fale com o Especialista Imobiliário para venda ou locação do seu imóvel</h3>
                    <p className="text-xs text-slate-500 leading-relaxed">
                      Clique no botão abaixo para preencher os dados do seu imóvel e enviar diretamente para o corretor responsável via WhatsApp.
                    </p>
                  </div>

                  <button 
                    onClick={() => setModalCorretorAberto(true)}
                    className="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-4 rounded-2xl transition cursor-pointer text-sm shadow-md flex items-center justify-center gap-2"
                  >
                    <span>📝 Abrir Formulário de Cadastro do Imóvel</span>
                  </button>
                </div>
              </div>
            )}

            {/* ABA: AGENDAMENTO DE MUDANÇAS */}
            {abaAtiva === 'mudancas' && (
              <div className="p-4 md:p-8 space-y-6">
                <div>
                  <h2 className="text-2xl font-black text-slate-900 tracking-tight">Agendamento de Mudanças</h2>
                  <p className="text-sm text-slate-500 mt-0.5">
                    Selecione o dia para a mudança. <strong className="text-rose-600">Regras: Proibido aos domingos e restrito a apenas 1 mudança por dia (dia inteiro).</strong>
                  </p>
                </div>

                <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-6 max-w-2xl">
                  <h3 className="font-bold text-slate-900 text-base">Agendar Nova Mudança (Dia Inteiro)</h3>

                  <div className="border border-slate-200 rounded-2xl p-4 bg-white shadow-2xs space-y-4">
                    <div className="flex items-center justify-between border-b pb-3 gap-2">
                      <div className="flex items-center gap-2">
                        <select 
                          value={mesIndex} 
                          onChange={(e) => {
                            const novoM = parseInt(e.target.value);
                            setMesIndex(novoM);
                            if (diaSelecionado > obterDiasNoMes(novoM, anoSelecionado)) {
                              setDiaSelecionado(1);
                            }
                          }}
                          className="bg-slate-100 text-slate-800 font-bold text-xs rounded-xl px-3 py-2 border border-slate-200 cursor-pointer capitalize"
                        >
                          {nomesMeses.map((m, idx) => (
                            <option key={idx} value={idx}>{m}</option>
                          ))}
                        </select>

                        <select 
                          value={anoSelecionado} 
                          onChange={(e) => {
                            const novoA = parseInt(e.target.value);
                            setAnoSelecionado(novoA);
                            if (diaSelecionado > obterDiasNoMes(mesIndex, novoA)) {
                              setDiaSelecionado(1);
                            }
                          }}
                          className="bg-slate-100 text-slate-800 font-bold text-xs rounded-xl px-3 py-2 border border-slate-200 cursor-pointer"
                        >
                          {[2025, 2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035].map((ano) => (
                            <option key={ano} value={ano}>{ano}</option>
                          ))}
                        </select>
                      </div>

                      <span className="text-xs text-slate-500 font-semibold">
                        Data Selecionada: {diaSelecionado < 10 ? '0' + diaSelecionado : diaSelecionado}/{nomesMeses[mesIndex].substring(0,3)}/{anoSelecionado}
                      </span>
                    </div>

                    <div className="grid grid-cols-7 gap-1 text-center text-xs pt-1">
                      {['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map((d, i) => (
                        <span key={i} className={`font-bold py-1 ${i === 0 ? 'text-rose-500' : 'text-slate-400'}`}>{d}</span>
                      ))}

                      {espacosVaziosInicio.map((_, i) => (
                        <div key={`vazio-${i}`} className="py-2"></div>
                      ))}

                      {diasMes.map((dia) => {
                        const selecionado = diaSelecionado === dia;
                        const dObj = new Date(anoSelecionado, mesIndex, dia);
                        const ehDomingoCalc = dObj.getDay() === 0;
                        const dataStrLoop = `${dia < 10 ? '0' + dia : dia}/${['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'][mesIndex]}/${anoSelecionado}`;
                        const diaOcupadoLoop = listaMudancas.some(m => m.data === dataStrLoop && m.status !== 'Rejeitada');

                        return (
                          <button
                            key={dia}
                            type="button"
                            disabled={ehDomingoCalc || diaOcupadoLoop}
                            onClick={() => setDiaSelecionado(dia)}
                            className={`py-2 rounded-full font-medium transition cursor-pointer flex items-center justify-center ${
                              ehDomingoCalc 
                                ? 'bg-rose-50 text-rose-300 line-through cursor-not-allowed' 
                                : diaOcupadoLoop
                                  ? 'bg-amber-100 text-amber-800 line-through cursor-not-allowed font-bold'
                                  : selecionado 
                                    ? 'bg-blue-600 text-white font-bold shadow-md' 
                                    : 'hover:bg-slate-100 text-slate-700'
                            }`}
                          >
                            {dia}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {eDomingo ? (
                    <div className="p-4 bg-rose-100 text-rose-900 rounded-xl text-xs font-bold text-center">
                      ❌ Domingos são fechados para mudanças. Por favor, selecione outro dia da semana.
                    </div>
                  ) : mudancaJaCadastradaNoDia ? (
                    <div className="p-4 bg-amber-100 text-amber-900 rounded-xl text-xs font-bold text-center">
                      ⚠️ Este dia já possui uma mudança agendada (limite de 1 por dia). Escolha outra data.
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <div className="p-4 bg-emerald-50 border border-emerald-200 text-emerald-900 rounded-xl text-xs font-medium text-center">
                        ✅ Data livre! A mudança será agendada para o <strong>Dia Inteiro</strong>.
                      </div>

                      <button 
                        onClick={solicitarMudanca}
                        className="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3.5 rounded-xl transition cursor-pointer text-xs shadow-md"
                      >
                        🚚 Confirmar Agendamento de Mudança (Dia Inteiro)
                      </button>
                    </div>
                  )}
                </div>

                <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4 max-w-2xl">
                  <h3 className="font-bold text-slate-900 text-base">Mudancas Agendadas no Condomínio</h3>
                  <div className="space-y-3">
                    {listaMudancas.length === 0 ? (
                      <p className="text-xs text-slate-500">Nenhuma mudança agendada.</p>
                    ) : (
                      listaMudancas.map(m => (
                        <div key={m.id} className="flex justify-between items-center p-4 rounded-xl border border-slate-100 bg-slate-50/50">
                          <div>
                            <h4 className="text-sm font-bold text-slate-900">Apto {m.unidade} — {m.morador}</h4>
                            <p className="text-xs text-slate-500 mt-0.5">Data: <strong>{m.data}</strong> · Período: <strong>Dia Inteiro</strong></p>
                          </div>
                          <div className="flex items-center gap-3">
                            <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-3 py-1 rounded-full">
                              {m.status}
                            </span>
                            {perfilLogado === 'sindico' && (
                              <button 
                                onClick={() => excluirMudancaSindico(m.id)}
                                className="px-2.5 py-1 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-[10px] font-bold transition cursor-pointer"
                              >
                                🗑️ Cancelar
                              </button>
                            )}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ABA: ACHADOS E PERDIDOS */}
            {abaAtiva === 'achados' && (
              <div className="p-4 md:p-8 space-y-6">
                <div>
                  <h2 className="text-2xl font-black text-slate-900 tracking-tight">Achados e Perdidos</h2>
                  <p className="text-sm text-slate-500 mt-0.5">
                    Cadastre itens encontrados (com código de localização automático). Ao entregar, exibe a mensagem com bloco, apto e o código.
                  </p>
                </div>

                <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4 max-w-3xl">
                  <h3 className="font-bold text-slate-900 text-base">Cadastrar Novo Item Encontrado</h3>
                  <form onSubmit={cadastrarAchadoPerdido} className="space-y-3">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                      <div className="md:col-span-2">
                        <label className="block text-xs font-bold text-slate-600 mb-1">Título / Descrição do Item:</label>
                        <input 
                          type="text" 
                          placeholder="Ex: Chaves, óculos, carteira..." 
                          value={novoAchadoTitulo}
                          onChange={(e) => setNovoAchadoTitulo(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">Bloco:</label>
                        <input 
                          type="text" 
                          placeholder="Ex: 2" 
                          value={novoAchadoBloco}
                          onChange={(e) => setNovoAchadoBloco(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">Apto:</label>
                        <input 
                          type="text" 
                          placeholder="Ex: 402" 
                          value={novoAchadoApto}
                          onChange={(e) => setNovoAchadoApto(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">Local onde foi encontrado:</label>
                      <input 
                        type="text" 
                        placeholder="Ex: Elevador Bloco 2 / Garagem" 
                        value={novoAchadoLocal}
                        onChange={(e) => setNovoAchadoLocal(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800"
                      />
                    </div>

                    <button 
                      type="submit"
                      className="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3 rounded-xl transition cursor-pointer text-xs shadow-md"
                    >
                      🔍 Cadastrar Item & Gerar Código de Localização
                    </button>
                  </form>
                </div>

                <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4 max-w-3xl">
                  <h3 className="font-bold text-slate-900 text-base">Itens Cadastrados em Achados e Perdidos</h3>
                  <div className="space-y-3">
                    {achadosPerdidos.length === 0 ? (
                      <p className="text-xs text-slate-500">Nenhum item cadastrado.</p>
                    ) : (
                      achadosPerdidos.map(item => (
                        <div key={item.id} className="flex flex-col md:flex-row justify-between items-start md:items-center p-5 rounded-xl border border-slate-100 bg-slate-50/50 gap-4">
                          <div className="space-y-1.5">
                            <div className="flex items-center gap-2 flex-wrap">
                              <h4 className="text-sm font-bold text-slate-900">{item.titulo}</h4>
                              <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                                item.status === 'Disponível' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                              }`}>
                                {item.status}
                              </span>
                              <span className="bg-blue-100 text-blue-900 font-mono font-bold text-[10px] px-2 py-0.5 rounded-md border border-blue-200">
                                🔑 Cod: {item.codigoLocalizacao}
                              </span>
                            </div>

                            <p className="text-xs text-slate-600">
                              Local: <strong>{item.local}</strong> · Data: {item.data} · Cadastrado por: <strong>{item.contato}</strong>
                            </p>

                            {item.blocoAptoRecebedor && (
                              <p className="text-xs text-emerald-700 font-bold bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200 inline-block">
                                ✓ {item.blocoAptoRecebedor}
                              </p>
                            )}
                          </div>

                          {item.status === 'Disponível' && (
                            <button 
                              onClick={() => marcarItemEntregue(item.id)}
                              className="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition cursor-pointer shrink-0 shadow-2xs"
                            >
                              ✓ Marcar como Entregue
                            </button>
                          )}
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ABA: CADASTRO DE ESPAÇOS */}
            {abaAtiva === 'cadastrar_espacos' && perfilLogado === 'sindico' && (
              <div className="p-4 md:p-8 space-y-6">
                <div>
                  <h2 className="text-2xl font-black text-slate-900 tracking-tight">Cadastrar e Gerenciar Espaços</h2>
                  <p className="text-sm text-slate-500 mt-0.5">Cadastre os espaços e defina os valores. Digite números (ex: 50 vira R$ 50,00) ou "Gratuito".</p>
                </div>

                <div className="bg-white p-6 rounded-3xl border border-amber-200 shadow-sm space-y-4 max-w-2xl bg-amber-50/30">
                  <h3 className="font-bold text-slate-900 text-base">Configuração de Contato do Morador</h3>
                  <div className="flex items-center justify-between bg-white p-4 rounded-xl border border-slate-200">
                    <div>
                      <h4 className="text-xs font-bold text-slate-900">Autoriza o morador entrar em contato?</h4>
                      <p className="text-[11px] text-slate-500 mt-0.5">Se marcar "Sim", o botão "Fale com o síndico ou deixe um recado" aparecerá para os moradores.</p>
                    </div>
                    <div className="flex gap-2">
                      <button 
                        type="button"
                        onClick={() => setAutorizaContatoSindico(true)}
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition cursor-pointer ${
                          autorizaContatoSindico 
                            ? 'bg-emerald-600 text-white shadow-md' 
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        Sim
                      </button>
                      <button 
                        type="button"
                        onClick={() => setAutorizaContatoSindico(false)}
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition cursor-pointer ${
                          !autorizaContatoSindico 
                            ? 'bg-rose-600 text-white shadow-md' 
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        Não
                      </button>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4 max-w-2xl">
                  <h3 className="font-bold text-slate-900 text-base">Adicionar Novo Espaço</h3>
                  <form onSubmit={cadastrarEspacoSindico} className="grid grid-cols-1 md:grid-cols-3 gap-3 items-end">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">Nome do Espaço:</label>
                      <input 
                        type="text" 
                        placeholder="Ex: Piscina / Salão" 
                        value={nomeNovoEspaco}
                        onChange={(e) => setNomeNovoEspaco(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">Valor (Ex: 50 ou Gratuito):</label>
                      <input 
                        type="text" 
                        placeholder="Ex: R$ 100,00 ou Gratuito" 
                        value={valorNovoEspaco}
                        onChange={(e) => setValorNovoEspaco(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800"
                      />
                    </div>
                    <button 
                      type="submit"
                      className="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3 rounded-xl transition cursor-pointer text-xs"
                    >
                      ➕ Cadastrar Espaço
                    </button>
                  </form>
                </div>

                <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                  <h3 className="font-bold text-slate-900 text-base">Espaços Atualmente Cadastrados</h3>
                  <div className="space-y-3">
                    {espacosDisponiveis.length === 0 ? (
                      <p className="text-xs text-slate-500">Nenhum espaço cadastrado no momento.</p>
                    ) : (
                      espacosDisponiveis.map((esp) => (
                        <div key={esp.id} className="flex items-center justify-between p-4 rounded-xl border border-slate-100 bg-slate-50/50">
                          <div>
                            <h4 className="text-sm font-bold text-slate-900">{esp.nome}</h4>
                            <p className="text-xs text-slate-500 mt-0.5">Taxa de Reserva: <strong>{esp.valor}</strong></p>
                          </div>
                          <button 
                            onClick={() => removerEspacoSindico(esp.id)}
                            className="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold transition cursor-pointer"
                          >
                            🗑️ Remover Espaço
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ABA: UNIDADES & MORADORES */}
            {abaAtiva === 'unidades' && perfilLogado === 'sindico' && (
              <div className="p-4 md:p-8 space-y-6">
                <div>
                  <h2 className="text-2xl font-black text-slate-900 tracking-tight">Unidades & Moradores</h2>
                  <p className="text-sm text-slate-500 mt-0.5">Cadastre novos moradores e gerencie os registros das unidades do condomínio.</p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                  {/* FORMULÁRIO DE CADASTRO (LADO ESQUERDO) */}
                  <div className="lg:col-span-2 bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
                    <h3 className="font-bold text-slate-900 text-base">Cadastrar Novo Morador</h3>
                    <form onSubmit={cadastrarMoradorSindico} className="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">Apto:</label>
                        <input 
                          type="text" 
                          placeholder="Ex: 501" 
                          value={novoAptoMorador}
                          onChange={(e) => setNovoAptoMorador(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800"
                        />
                      </div>
                      <div className="md:col-span-2">
                        <label className="block text-xs font-bold text-slate-600 mb-1">Nome Completo:</label>
                        <input 
                          type="text" 
                          placeholder="Ex: Roberto Souza" 
                          value={novoNomeMorador}
                          onChange={(e) => setNovoNomeMorador(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">Perfil:</label>
                        <select 
                          value={novoPerfilMorador} 
                          onChange={(e) => setNovoPerfilMorador(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800"
                        >
                          <option value="Proprietário">Proprietário</option>
                          <option value="Inquilino">Inquilino</option>
                        </select>
                      </div>
                      <div className="md:col-span-3">
                        <label className="block text-xs font-bold text-slate-600 mb-1">Telefone com DDD:</label>
                        <input 
                          type="text" 
                          placeholder="(21) 990214908" 
                          value={novoTelMorador}
                          onChange={(e) => {
                            let v = e.target.value.replace(/[^\d]/g, '');
                            if (v.length > 11) v = v.substring(0, 11);
                            if (v.length > 2) {
                              v = `(${v.substring(0,2)}) ${v.substring(2)}`;
                            } else if (v.length > 0) {
                              v = `(${v}`;
                            }
                            setNovoTelMorador(v);
                          }}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800"
                        />
                      </div>
                      <div>
                        <button 
                          type="submit"
                          className="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3 rounded-xl transition cursor-pointer text-xs shadow-md"
                        >
                          ➕ Cadastrar Morador
                        </button>
                      </div>
                    </form>
                  </div>

                  {/* CARD DE CHAVE MESTRA DO CONDOMÍNIO */}
                  <div className="bg-amber-50/80 border border-amber-300 rounded-3xl p-6 shadow-sm space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="text-xl">🔑</span>
                      <h3 className="font-black text-amber-950 text-sm">Chave Mestra do Condomínio</h3>
                    </div>
                    <p className="text-xs text-amber-900 leading-relaxed">
                      Esta é a sua chave mestra exclusiva atrelada ao e-mail <strong>{emailSindicoLogado}</strong>. Compartilhe com os moradores para o primeiro login deles:
                    </p>
